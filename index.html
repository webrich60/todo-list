<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO管理 - 見やすい祝日カレンダー操作版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"
      crossorigin
    ></script>

    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideInRight {
        from {
          transform: translateX(2rem);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes bouncePulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }
      .animate-in {
        animation-duration: 400ms;
        animation-fill-mode: both;
      }
      .fade-in {
        animation-name: fadeIn;
      }
      .slide-in-from-right-8 {
        animation-name: slideInRight;
      }
      .animate-bounce-pulse {
        animation: bouncePulse 2s infinite;
      }
      body {
        font-family:
          "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
          Meiryo, sans-serif;
        background-color: #f7f5f0;
        color: #334155;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      input[type="datetime-local"] {
        -webkit-appearance: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-status"
        style="
          max-width: 460px;
          margin: 64px auto;
          padding: 24px;
          border: 2px solid #e2e8f0;
          border-radius: 24px;
          background: #fff;
          text-align: center;
          font-weight: 700;
          color: #475569;
        "
      >
        TODO管理を読み込んでいます…
      </div>
    </div>

    <script>
      // 外部ライブラリの読込失敗や実行時エラーでも、真っ白な画面にしない。
      window.__todoAppMounted = false;
      window.addEventListener("error", function (event) {
        if (window.__todoAppMounted) return;
        const root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="max-width:460px;margin:64px auto;padding:24px;border:2px solid #fecaca;border-radius:24px;background:#fff1f2;color:#991b1b;text-align:center;font-family:sans-serif;">' +
          '<h1 style="font-size:20px;margin:0 0 12px;">画面の読み込みに失敗しました</h1>' +
          '<p style="line-height:1.7;margin:0 0 16px;">通信が安定した場所で再読み込みしてください。何度も続く場合は、設定から端末データを復旧できます。</p>' +
          '<button onclick="location.reload()" style="border:0;border-radius:12px;background:#334155;color:white;padding:12px 20px;font-weight:700;">再読み込み</button></div>';
      });
      setTimeout(function () {
        if (!window.__todoAppMounted) {
          window.dispatchEvent(
            new ErrorEvent("error", { message: "起動タイムアウト" }),
          );
        }
      }, 12000);
    </script>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const DEFAULT_CATEGORIES = [
        "未分類",
        "仕事",
        "プライベート",
        "旅行",
        "観光",
        "遊び",
        "外食",
        "病院",
      ];
      const CATEGORY_STORAGE_KEY = "todo_categories_v25";

      const normalizeCategories = (values) => {
        const merged = [...DEFAULT_CATEGORIES, ...(Array.isArray(values) ? values : [])]
          .map((value) => {
            if (value && typeof value === "object") {
              return String(value.category || value.name || value.value || "").trim();
            }
            return String(value || "").trim();
          })
          .filter((value) => value && value !== "[object Object]");
        return [...new Set(merged)];
      };

      const readLocalCategories = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY) || "[]");
          return normalizeCategories(saved);
        } catch (_) {
          return [...DEFAULT_CATEGORIES];
        }
      };

      const writeLocalCategories = (values) => {
        const normalized = normalizeCategories(values);
        try {
          localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(normalized));
        } catch (_) {}
        return normalized;
      };

      const formatLocalDateKey = (value) => {
        const date = value instanceof Date ? value : new Date(value);
        if (isNaN(date.getTime())) return "";
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };

      const dateKeyToLabel = (key) => {
        const date = new Date(`${key}T00:00:00`);
        if (isNaN(date.getTime())) return key;
        return date.toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
        });
      };


      // 日本の祝日判定（祝日法ベース）。外部APIに依存せず、オフラインでも表示できる。
      // 春分・秋分の計算は1948～2150年を対象とする近似式。
      const JAPAN_HOLIDAY_CACHE = new Map();

      const nthWeekdayOfMonth = (year, monthIndex, weekday, nth) => {
        const first = new Date(year, monthIndex, 1);
        const offset = (7 + weekday - first.getDay()) % 7;
        return 1 + offset + (nth - 1) * 7;
      };

      const vernalEquinoxDay = (year) => {
        if (year <= 1979) {
          return Math.floor(
            20.8357 +
              0.242194 * (year - 1980) -
              Math.floor((year - 1983) / 4),
          );
        }
        if (year <= 2099) {
          return Math.floor(
            20.8431 +
              0.242194 * (year - 1980) -
              Math.floor((year - 1980) / 4),
          );
        }
        return Math.floor(
          21.851 +
            0.242194 * (year - 1980) -
            Math.floor((year - 1980) / 4),
        );
      };

      const autumnEquinoxDay = (year) => {
        if (year <= 1979) {
          return Math.floor(
            23.2588 +
              0.242194 * (year - 1980) -
              Math.floor((year - 1983) / 4),
          );
        }
        if (year <= 2099) {
          return Math.floor(
            23.2488 +
              0.242194 * (year - 1980) -
              Math.floor((year - 1980) / 4),
          );
        }
        return Math.floor(
          24.2488 +
            0.242194 * (year - 1980) -
            Math.floor((year - 1980) / 4),
        );
      };

      const buildJapaneseHolidayMap = (year) => {
        if (JAPAN_HOLIDAY_CACHE.has(year)) {
          return JAPAN_HOLIDAY_CACHE.get(year);
        }
        const holidays = new Map();
        const add = (month, day, name) => {
          const key = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          holidays.set(key, name);
        };

        // 国民の祝日（現行制度を中心に、名称・日付変更も反映）
        if (year >= 1949) add(1, 1, "元日");
        if (year >= 2000) {
          add(1, nthWeekdayOfMonth(year, 0, 1, 2), "成人の日");
        } else if (year >= 1949) {
          add(1, 15, "成人の日");
        }
        if (year >= 1967) add(2, 11, "建国記念の日");
        if (year >= 2020) {
          add(2, 23, "天皇誕生日");
        } else if (year >= 1989 && year <= 2018) {
          add(12, 23, "天皇誕生日");
        }
        if (year >= 1949 && year <= 2150) {
          add(3, vernalEquinoxDay(year), "春分の日");
        }

        if (year >= 2007) {
          add(4, 29, "昭和の日");
        } else if (year >= 1989) {
          add(4, 29, "みどりの日");
        } else if (year >= 1949) {
          add(4, 29, "天皇誕生日");
        }
        if (year >= 1949) add(5, 3, "憲法記念日");
        if (year >= 2007) add(5, 4, "みどりの日");
        if (year >= 1949) add(5, 5, "こどもの日");

        if (year === 2020) {
          add(7, 23, "海の日");
        } else if (year === 2021) {
          add(7, 22, "海の日");
        } else if (year >= 2003) {
          add(7, nthWeekdayOfMonth(year, 6, 1, 3), "海の日");
        } else if (year >= 1996) {
          add(7, 20, "海の日");
        }

        if (year === 2020) {
          add(8, 10, "山の日");
        } else if (year === 2021) {
          add(8, 8, "山の日");
        } else if (year >= 2016) {
          add(8, 11, "山の日");
        }

        if (year >= 2003) {
          add(9, nthWeekdayOfMonth(year, 8, 1, 3), "敬老の日");
        } else if (year >= 1966) {
          add(9, 15, "敬老の日");
        }
        if (year >= 1948 && year <= 2150) {
          add(9, autumnEquinoxDay(year), "秋分の日");
        }

        if (year === 2020) {
          add(7, 24, "スポーツの日");
        } else if (year === 2021) {
          add(7, 23, "スポーツの日");
        } else if (year >= 2000) {
          add(10, nthWeekdayOfMonth(year, 9, 1, 2), year >= 2020 ? "スポーツの日" : "体育の日");
        } else if (year >= 1966) {
          add(10, 10, "体育の日");
        }
        if (year >= 1948) add(11, 3, "文化の日");
        if (year >= 1948) add(11, 23, "勤労感謝の日");

        // 皇室行事に伴う臨時の国民の祝日
        if (year === 1990) add(11, 12, "即位礼正殿の儀");
        if (year === 1993) add(6, 9, "皇太子徳仁親王の結婚の儀");
        if (year === 2019) {
          add(5, 1, "天皇の即位の日");
          add(10, 22, "即位礼正殿の儀");
        }

        // 国民の休日：前日・翌日が祝日に挟まれた平日（1986年以降）
        if (year >= 1986) {
          const start = new Date(year, 0, 2);
          const end = new Date(year, 11, 30);
          for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            const key = formatLocalDateKey(d);
            if (holidays.has(key) || d.getDay() === 0) continue;
            const prev = new Date(d);
            const next = new Date(d);
            prev.setDate(prev.getDate() - 1);
            next.setDate(next.getDate() + 1);
            if (
              holidays.has(formatLocalDateKey(prev)) &&
              holidays.has(formatLocalDateKey(next))
            ) {
              holidays.set(key, "国民の休日");
            }
          }
        }

        // 振替休日。2007年以降は次の祝日でない日まで繰り越す。
        if (year >= 1973) {
          const originalEntries = [...holidays.entries()];
          originalEntries.forEach(([key]) => {
            const holidayDate = new Date(`${key}T00:00:00`);
            if (holidayDate.getDay() !== 0) return;
            let substitute = new Date(holidayDate);
            substitute.setDate(substitute.getDate() + 1);
            if (year < 2007) {
              const substituteKey = formatLocalDateKey(substitute);
              if (!holidays.has(substituteKey)) {
                holidays.set(substituteKey, "振替休日");
              }
              return;
            }
            while (holidays.has(formatLocalDateKey(substitute))) {
              substitute.setDate(substitute.getDate() + 1);
            }
            holidays.set(formatLocalDateKey(substitute), "振替休日");
          });
        }

        JAPAN_HOLIDAY_CACHE.set(year, holidays);
        return holidays;
      };

      const getJapaneseHolidayName = (date) => {
        if (!(date instanceof Date) || isNaN(date.getTime())) return "";
        const map = buildJapaneseHolidayMap(date.getFullYear());
        return map.get(formatLocalDateKey(date)) || "";
      };

      const normalizeTodo = (raw, index = 0) => {
        const item = raw && typeof raw === "object" ? raw : {};
        const legacyCompleted =
          item.completed === true || item.completed === "TRUE";
        const rawStatus = String(item.status || "");
        const allowedStatuses = ["未完了", "完了"];
        // 旧版の「チェック済」は、現在の仕様では「完了」と同じ扱いにする。
        const normalizedStatus =
          rawStatus === "チェック済"
            ? "完了"
            : allowedStatuses.includes(rawStatus)
              ? rawStatus
              : legacyCompleted
                ? "完了"
                : "未完了";
        const parsedId = Number(item.id);
        return {
          ...item,
          id: Number.isFinite(parsedId) ? parsedId : Date.now() + index,
          type: item.type === "memo" ? "memo" : "todo",
          title: String(item.title || ""),
          description: String(item.description || ""),
          category: String(item.category || "未分類").trim() || "未分類",
          dueDate: item.dueDate || null,
          endDate: item.endDate || null,
          color: item.color || "blue",
          priority: ["高", "中", "低"].includes(item.priority)
            ? item.priority
            : "中",
          mailNotify: item.mailNotify === true || item.mailNotify === "TRUE",
          status: normalizedStatus,
          completedAt: item.completedAt || null,
          updatedAt: item.updatedAt || item.modifiedAt || "",
        };
      };

      const updatedTime = (todo) => {
        const time = new Date(
          todo && todo.updatedAt ? todo.updatedAt : 0,
        ).getTime();
        return Number.isFinite(time) ? time : 0;
      };

      const mergeLocalAndCloudTodos = (localTodos, cloudTodos) => {
        const localById = new Map(localTodos.map((todo) => [todo.id, todo]));
        const cloudIds = new Set();
        let needsCloudRepair = false;

        const merged = cloudTodos.map((cloudTodo) => {
          cloudIds.add(cloudTodo.id);
          const localTodo = localById.get(cloudTodo.id);
          if (!localTodo) return cloudTodo;

          const localTime = updatedTime(localTodo);
          const cloudTime = updatedTime(cloudTodo);
          let selected = cloudTodo;

          if (localTime > cloudTime) {
            selected = localTodo;
            needsCloudRepair = true;
          } else if (
            localTime === cloudTime &&
            localTodo.status === "完了" &&
            cloudTodo.status !== "完了"
          ) {
            // 日時のない旧データでは、完了状態を未完了で巻き戻さない。
            selected = localTodo;
            needsCloudRepair = true;
          }

          return localTodo.imageUrl
            ? { ...selected, imageUrl: localTodo.imageUrl }
            : selected;
        });

        localTodos.forEach((localTodo) => {
          if (!cloudIds.has(localTodo.id) && localTodo.updatedAt) {
            merged.push(localTodo);
            needsCloudRepair = true;
          }
        });

        return { merged, needsCloudRepair };
      };

      const readLocalTodos = () => {
        try {
          const saved = localStorage.getItem("todos");
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) ? parsed.map(normalizeTodo) : [];
        } catch (error) {
          console.error("端末データの読込エラー:", error);
          // 壊れたJSONは退避して、アプリ自体は起動させる。
          try {
            localStorage.setItem(
              "todos_corrupted_backup",
              localStorage.getItem("todos") || "",
            );
          } catch (_) {}
          try {
            localStorage.removeItem("todos");
          } catch (_) {}
          return [];
        }
      };

      const TODO_DB_NAME = "webrich_todo_database";
      const TODO_DB_STORE = "app_state";

      const openTodoDatabase = () =>
        new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error("このブラウザは大容量保存に対応していません。"));
            return;
          }
          const request = window.indexedDB.open(TODO_DB_NAME, 1);
          request.onerror = () => reject(request.error);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(TODO_DB_STORE)) {
              database.createObjectStore(TODO_DB_STORE);
            }
          };
          request.onsuccess = () => resolve(request.result);
        });

      const readIndexedTodos = async () => {
        const database = await openTodoDatabase();
        try {
          return await new Promise((resolve, reject) => {
            const transaction = database.transaction(TODO_DB_STORE, "readonly");
            const request = transaction.objectStore(TODO_DB_STORE).get("todos");
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
              const value = request.result;
              resolve(Array.isArray(value) ? value.map(normalizeTodo) : []);
            };
          });
        } finally {
          database.close();
        }
      };

      const saveIndexedTodos = async (items) => {
        const database = await openTodoDatabase();
        try {
          await new Promise((resolve, reject) => {
            const transaction = database.transaction(
              TODO_DB_STORE,
              "readwrite",
            );
            transaction.onerror = () => reject(transaction.error);
            transaction.onabort = () => reject(transaction.error);
            transaction.oncomplete = () => resolve();
            transaction.objectStore(TODO_DB_STORE).put(items, "todos");
          });
        } finally {
          database.close();
        }
      };

      let databaseErrorShown = false;
      const writeLocalTodos = (items) => {
        saveIndexedTodos(items)
          .then(() => {
            // 大容量DBへの保存成功後にだけ、旧localStorageを削除する。
            try {
              localStorage.removeItem("todos");
              localStorage.removeItem("todos_corrupted_backup");
            } catch (_) {}
          })
          .catch((error) => {
            console.error("大容量データベースの保存エラー:", error);
            if (!databaseErrorShown) {
              databaseErrorShown = true;
              alert(
                "大容量データベースへの保存に失敗しました。ページを再読み込みして、もう一度お試しください。",
              );
            }
          });
        return items;
      };

      const compressImageSource = (source) =>
        new Promise((resolve, reject) => {
          const image = new Image();
          image.onerror = () =>
            reject(new Error("写真の形式を確認できませんでした。"));
          image.onload = () => {
            try {
              const maxSide = 1200;
              const scale = Math.min(
                1,
                maxSide / Math.max(image.width, image.height),
              );
              const width = Math.max(1, Math.round(image.width * scale));
              const height = Math.max(1, Math.round(image.height * scale));
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const context = canvas.getContext("2d");
              context.fillStyle = "#ffffff";
              context.fillRect(0, 0, width, height);
              context.drawImage(image, 0, 0, width, height);

              let result = canvas.toDataURL("image/jpeg", 0.72);
              if (result.length > 800000) {
                result = canvas.toDataURL("image/jpeg", 0.52);
              }
              resolve(result);
            } catch (error) {
              reject(error);
            }
          };
          image.src = source;
        });

      const compressImageFile = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () =>
            reject(new Error("写真を読み込めませんでした。"));
          reader.onload = async () => {
            try {
              resolve(await compressImageSource(reader.result));
            } catch (error) {
              reject(error);
            }
          };
          reader.readAsDataURL(file);
        });

      class AppErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false };
        }
        static getDerivedStateFromError() {
          return { hasError: true };
        }
        componentDidCatch(error, info) {
          console.error("画面描画エラー:", error, info);
        }
        render() {
          if (!this.state.hasError) return this.props.children;
          return (
            <div className="min-h-screen px-4 py-16 bg-rose-50 text-slate-700">
              <div className="max-w-md mx-auto bg-white border-2 border-rose-200 rounded-3xl p-7 text-center shadow-sm">
                <i className="fa-solid fa-triangle-exclamation text-rose-500 text-3xl mb-4"></i>
                <h1 className="text-xl font-black mb-3">
                  表示エラーから保護しました
                </h1>
                <p className="text-sm leading-relaxed text-slate-500 mb-6">
                  真っ白な画面にはせず、端末内のデータを残したまま停止しています。まず再読み込みをお試しください。
                </p>
                <button
                  onClick={() => location.reload()}
                  className="w-full py-3 bg-slate-800 text-white font-black rounded-xl"
                >
                  再読み込み
                </button>
              </div>
            </div>
          );
        }
      }

      const App = () => {
        const [currentTime, setCurrentTime] = useState(new Date());
        const [currentView, setCurrentView] = useState("list");
        const [isLoading, setIsLoading] = useState(false);
        const [isSyncing, setIsSyncing] = useState(false);
        const [syncError, setSyncError] = useState(false);

        const [gasUrl, setGasUrl] = useState(
          () => localStorage.getItem("gas_url") || "",
        );

        const [todos, setTodos] = useState(readLocalTodos);
        const lastLocalMutationRef = useRef(0);
        const requestSequenceRef = useRef(0);
        const cloudRepairScheduledRef = useRef(false);
        const latestSyncRef = useRef(0);

        const [editingTodo, setEditingTodo] = useState(null);
        const [formReturnView, setFormReturnView] = useState("list");
        const [formReturnDateKey, setFormReturnDateKey] = useState("");
        const [newType, setNewType] = useState("todo");
        const [newTitle, setNewTitle] = useState("");
        const [newDescription, setNewDescription] = useState("");
        const [newDueDate, setNewDueDate] = useState("");
        const [newEndDate, setNewEndDate] = useState("");
        const [newImage, setNewImage] = useState(null);
        const [isCompressingImage, setIsCompressingImage] = useState(false);
        const [newColor, setNewColor] = useState("blue");
        const [newPriority, setNewPriority] = useState("中");
        const [newMailNotify, setNewMailNotify] = useState(false);
        const [newCategory, setNewCategory] = useState("未分類");
        const [categories, setCategories] = useState(readLocalCategories);
        const [categoryDraft, setCategoryDraft] = useState("");
        const [calendarCursor, setCalendarCursor] = useState(() => {
          const now = new Date();
          return new Date(now.getFullYear(), now.getMonth(), 1);
        });
        const [selectedDateKey, setSelectedDateKey] = useState(() =>
          formatLocalDateKey(new Date()),
        );

        // 旧localStorageから大容量IndexedDBへ、安全に一度だけ移行する。
        useEffect(() => {
          let cancelled = false;
          const initializeDatabase = async () => {
            try {
              const legacyTodos = todos;
              if (legacyTodos.length > 0) {
                await saveIndexedTodos(legacyTodos);
                if (!cancelled) {
                  try {
                    localStorage.removeItem("todos");
                    localStorage.removeItem("todos_corrupted_backup");
                  } catch (_) {}
                }
                return;
              }

              const databaseTodos = await readIndexedTodos();
              if (!cancelled && databaseTodos.length > 0) {
                setTodos((currentTodos) => {
                  if (currentTodos.length === 0) return databaseTodos;
                  const { merged, needsCloudRepair } = mergeLocalAndCloudTodos(
                    databaseTodos,
                    currentTodos,
                  );
                  if (needsCloudRepair && !cloudRepairScheduledRef.current) {
                    cloudRepairScheduledRef.current = true;
                    setTimeout(async () => {
                      await exportToSpreadsheet(merged);
                      cloudRepairScheduledRef.current = false;
                    }, 200);
                  }
                  writeLocalTodos(merged);
                  return merged;
                });
              }
            } catch (error) {
              console.error("大容量データベースの初期化エラー:", error);
            }
          };
          initializeDatabase();
          return () => {
            cancelled = true;
          };
        }, []);

        useEffect(() => {
          loadTodosFromSpreadsheet(true);
        }, [gasUrl]);

        useEffect(() => {
          if (!gasUrl) return;
          loadCategoriesFromSpreadsheet();
        }, [gasUrl]);

        useEffect(() => {
          const categoriesFromTodos = todos
            .map((todo) => todo.category)
            .filter(Boolean);
          if (!categoriesFromTodos.length) return;
          setCategories((current) => {
            const merged = normalizeCategories([...current, ...categoriesFromTodos]);
            return JSON.stringify(merged) === JSON.stringify(current)
              ? current
              : writeLocalCategories(merged);
          });
        }, [todos]);

        useEffect(() => {
          if (!gasUrl) return;
          const syncTimer = setInterval(() => {
            loadTodosFromSpreadsheet(true);
          }, 30000);
          return () => clearInterval(syncTimer);
        }, [gasUrl]);

        useEffect(() => {
          const timer = setInterval(() => setCurrentTime(new Date()), 60000);
          return () => clearInterval(timer);
        }, []);

        // 旧版で保存された大きな写真も、初回起動時に順番に軽量化する。
        useEffect(() => {
          let cancelled = false;
          const migrateExistingImages = async () => {
            const compressedById = new Map();
            for (const todo of todos) {
              if (
                cancelled ||
                !todo.imageUrl ||
                !String(todo.imageUrl).startsWith("data:image/") ||
                String(todo.imageUrl).length < 250000
              ) {
                continue;
              }
              try {
                const compressed = await compressImageSource(todo.imageUrl);
                compressedById.set(todo.id, compressed);
              } catch (error) {
                console.error("既存写真の軽量化エラー:", error);
              }
            }
            if (cancelled || compressedById.size === 0) return;
            setTodos((currentTodos) => {
              const migratedTodos = currentTodos.map((todo) =>
                compressedById.has(todo.id)
                  ? { ...todo, imageUrl: compressedById.get(todo.id) }
                  : todo,
              );
              return writeLocalTodos(migratedTodos) || migratedTodos;
            });
          };
          migrateExistingImages();
          return () => {
            cancelled = true;
          };
        }, []);

        const loadTodosFromSpreadsheet = (isSilent = false) => {
          if (!gasUrl) return;
          // 保存直後に古いクラウドデータで巻き戻される競合を防ぐ。
          if (isSilent && Date.now() - lastLocalMutationRef.current < 15000)
            return;
          if (!isSilent) setIsLoading(true);

          const requestNumber = ++requestSequenceRef.current;
          const callbackName =
            "gasCallback_" + Date.now() + "_" + requestNumber;
          let isResponded = false;

          window[callbackName] = (data) => {
            isResponded = true;
            setSyncError(false);
            // 後から開始した再読込がある場合、古い応答では上書きしない。
            if (requestNumber !== requestSequenceRef.current) {
              if (!isSilent) setIsLoading(false);
              cleanup();
              return;
            }
            if (Array.isArray(data)) {
              const normalizedData = data.map(normalizeTodo);
              setTodos((prevTodos) => {
                // 初回接続時、空のシートで端末データを消さない。
                // 右上の手動再読込を押した場合だけ、空データも反映する。
                if (
                  isSilent &&
                  normalizedData.length === 0 &&
                  prevTodos.length > 0
                ) {
                  return prevTodos;
                }
                const { merged: mergedData, needsCloudRepair } =
                  mergeLocalAndCloudTodos(prevTodos, normalizedData);
                if (needsCloudRepair && !cloudRepairScheduledRef.current) {
                  cloudRepairScheduledRef.current = true;
                  setTimeout(async () => {
                    await exportToSpreadsheet(mergedData);
                    cloudRepairScheduledRef.current = false;
                  }, 200);
                }
                const prevStr = JSON.stringify(prevTodos);
                const nextStr = JSON.stringify(mergedData);
                if (prevStr !== nextStr) {
                  return writeLocalTodos(mergedData) || mergedData;
                }
                return prevTodos;
              });
            }
            if (!isSilent) setIsLoading(false);
            cleanup();
          };

          const cleanup = () => {
            delete window[callbackName];
            const scriptEl = document.getElementById(callbackName);
            if (scriptEl) scriptEl.remove();
          };

          const script = document.createElement("script");
          script.id = callbackName;
          const separator = gasUrl.includes("?") ? "&" : "?";
          script.src = `${gasUrl}${separator}callback=${callbackName}&_=${Date.now()}`;

          script.onerror = () => {
            isResponded = true;
            setSyncError(true);
            if (!isSilent) setIsLoading(false);
            cleanup();
          };

          setTimeout(() => {
            if (!isResponded) {
              setSyncError(true);
              if (!isSilent) setIsLoading(false);
              cleanup();
            }
          }, 8000);

          document.body.appendChild(script);
        };

        const loadCategoriesFromSpreadsheet = () => {
          if (!gasUrl) return;
          const callbackName = "gasCategoryCallback_" + Date.now();
          let finished = false;
          const cleanup = () => {
            delete window[callbackName];
            const scriptEl = document.getElementById(callbackName);
            if (scriptEl) scriptEl.remove();
          };
          window[callbackName] = (data) => {
            finished = true;
            if (Array.isArray(data)) {
              setCategories((current) =>
                writeLocalCategories([...current, ...data]),
              );
            }
            cleanup();
          };
          const script = document.createElement("script");
          script.id = callbackName;
          const separator = gasUrl.includes("?") ? "&" : "?";
          script.src = `${gasUrl}${separator}action=categories&callback=${callbackName}&_=${Date.now()}`;
          script.onerror = cleanup;
          setTimeout(() => {
            if (!finished) cleanup();
          }, 8000);
          document.body.appendChild(script);
        };

        const saveCategoriesToSpreadsheet = async (nextCategories) => {
          if (!gasUrl) return;
          try {
            await fetch(gasUrl, {
              method: "POST",
              mode: "no-cors",
              cache: "no-store",
              headers: { "Content-Type": "text/plain;charset=UTF-8" },
              body: JSON.stringify({
                action: "saveCategories",
                categories: normalizeCategories(nextCategories),
              }),
            });
          } catch (error) {
            console.error("カテゴリ同期エラー:", error);
          }
        };

        const addCategory = async () => {
          const name = categoryDraft.trim();
          if (!name) return;
          const nextCategories = writeLocalCategories([...categories, name]);
          setCategories(nextCategories);
          setNewCategory(name);
          setCategoryDraft("");
          await saveCategoriesToSpreadsheet(nextCategories);
        };

        const saveGasUrl = (url) => {
          setGasUrl(url.trim());
          localStorage.setItem("gas_url", url.trim());
          alert("連携URLを保存しました。");
          setCurrentView("list");

        const handleImageChange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            alert("画像ファイルを選択してください。");

          setIsCompressingImage(true);
          try {

          } catch (error) {
            console.error("写真の圧縮エラー:", error);
            alert("写真を読み込めませんでした。別の写真でお試しください。");
          } finally {
            setIsCompressingImage(false);
            e.target.value = "";
          }
        };

        const resetForm = () => {
          setNewType("todo");
          setNewTitle("");
          setNewDescription("");
          setNewDueDate("");
          setNewEndDate("");
          setNewImage(null);
          setIsCompressingImage(false);
          setNewColor("blue");
          setNewPriority("中");
          setNewMailNotify(false);
          setNewCategory("未分類");
          setCategoryDraft("");
          setEditingTodo(null);
        };

        const exportToSpreadsheet = async (currentTodos) => {
          if (!gasUrl) return false;
          const syncToken = Date.now() + Math.random();
          latestSyncRef.current = syncToken;
          setIsSyncing(true);
          setSyncError(false);
          let saved = false;
          try {
            const exportData = currentTodos.map((t) => ({
              id: t.id,
              type: t.type || "todo",
              title: t.title,
              description: t.description || "",
              category: t.category || "未分類",
              priority: t.priority || "中",
              dueDate: t.dueDate || "",
              endDate: t.endDate || "",
              color: t.color || "blue",
              status: t.status || "未完了",
              mailNotify: t.mailNotify || false,
              completedAt: t.completedAt || "",
              updatedAt: t.updatedAt || "",
            }));
            for (let attempt = 0; attempt < 2; attempt += 1) {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 10000);
              try {
                await fetch(gasUrl, {
                  method: "POST",
                  mode: "no-cors",
                  cache: "no-store",
                  headers: { "Content-Type": "text/plain;charset=UTF-8" },
                  body: JSON.stringify(exportData),
                  signal: controller.signal,
                });
                saved = true;
                break;
              } catch (error) {
                if (attempt === 1) throw error;
                await new Promise((resolve) => setTimeout(resolve, 800));
              } finally {
                clearTimeout(timeoutId);
              }
            }
          } catch (error) {
            console.error("同期エラー:", error);
            setSyncError(true);
          } finally {
            if (latestSyncRef.current === syncToken) {
              setIsSyncing(false);
            }
          }
          return saved;
        };

        const addTodo = async (e) => {

        const updateTodo = async (e) => {

          if (!newTitle.trim() || !editingTodo) return;

          const updatedTodo = {
            ...editingTodo,
            type: newType,
            title: newTitle.trim(),
            description: newDescription.trim(),
            category: newCategory || "未分類",

            color: newColor,

          };

          const updatedTodos = todos.map((t) =>
            t.id === editingTodo.id ? updatedTodo : t,
          );
          lastLocalMutationRef.current = Date.now();
          const storedTodos = writeLocalTodos(updatedTodos) || updatedTodos;
          setTodos(storedTodos);
          const viewToReturn = formReturnView ||
            (updatedTodo.status === "完了"
              ? "history"
              : updatedTodo.type === "memo"

          const returnDateKey = formReturnDateKey;

          if (viewToReturn === "calendar" && returnDateKey) {

            setSelectedDateKey(returnDateKey);
            setCalendarCursor(

            );

          setCurrentView(viewToReturn);
          await exportToSpreadsheet(storedTodos);

        const startEdit = (

        ) => {

        const deleteTodoFromSpreadsheet = async (id) => {
          if (!gasUrl) return false;

            await fetch(gasUrl, {
              method: "POST",
              mode: "no-cors",

        const deleteTodo = async (id) => {

            const updatedTodos = todos.filter((todo) => todo.id !== id);
            lastLocalMutationRef.current = Date.now();
            const storedTodos = writeLocalTodos(updatedTodos) || updatedTodos;
            setTodos(storedTodos);
            await deleteTodoFromSpreadsheet(id);
          }

        // チェックで即座に完了履歴へ移動。履歴側で押すと未完了へ戻す。
        const toggleComplete = async (id) => {
          const updatedTodos = todos.map((todo) => {
            if (todo.id === id) {
              const isDone = todo.status === "完了";
              return {
                ...todo,
                status: isDone ? "未完了" : "完了",
                completedAt: isDone ? null : new Date().toISOString(),
                updatedAt: new Date().toISOString(),
              };
            }
            return todo;
          });
          lastLocalMutationRef.current = Date.now();
          const storedTodos = writeLocalTodos(updatedTodos) || updatedTodos;
          setTodos(storedTodos);
          await exportToSpreadsheet(storedTodos);
        };

        const openTodoInCalendar = (todo) => {
          if (!todo.dueDate) return;
          const key = formatLocalDateKey(todo.dueDate);
          if (!key) return;
          const date = new Date(`${key}T00:00:00`);
          setSelectedDateKey(key);
          setCalendarCursor(new Date(date.getFullYear(), date.getMonth(), 1));
          setCurrentView("calendar");
        };

        const addFromCalendar = (dateKey) => {
          resetForm();
          setFormReturnView("calendar");
          setFormReturnDateKey(dateKey);
          setNewDueDate(`${dateKey}T09:00`);
          setSelectedDateKey(dateKey);
          setCurrentView("input");
        };

        const todoOccursOnDate = (todo, dateKey) => {
          // カレンダーは「期限」の日だけに表示する。
          // 旧データの「終了日時」を期間予定として解釈すると、
          // TODOが入っていない日まで連続表示されるため使用しない。
          if (!todo.dueDate) return false;
          const dueKey = formatLocalDateKey(todo.dueDate);
          return Boolean(dueKey) && dueKey === dateKey;
        };

        // フィルターの条件：「未完了」と「チェック済」は表示。「完了」のみ履歴へ。
        const activeTodos = todos.filter(
          (todo) =>
            todo.status !== "完了" && (todo.type === "todo" || !todo.type),
        );
        const activeMemos = todos.filter(
          (todo) => todo.status !== "完了" && todo.type === "memo",
        );
        const completedTodos = todos
          .filter((todo) => todo.status === "完了")
          .sort((a, b) => {
            const aTime =
              new Date(a.completedAt || Number(a.id) || 0).getTime() || 0;
            const bTime =
              new Date(b.completedAt || Number(b.id) || 0).getTime() || 0;
            return bTime - aTime;
          });

        const expiredTodos = activeTodos.filter((todo) => {
          if (!todo.dueDate || todo.status === "チェック済") return false;
          const d = new Date(todo.dueDate);
          return !isNaN(d.getTime()) && d < currentTime;
        });

        const sortFunction = (a, b) => {
          const pOrder = { 高: 1, 中: 2, 低: 3 };
          const pA = pOrder[a.priority] || 2;
          const pB = pOrder[b.priority] || 2;
          if (pA !== pB) return pA - pB;
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          const timeA = new Date(a.dueDate).getTime();
          const timeB = new Date(b.dueDate).getTime();
          return (
            (isNaN(timeA) ? Infinity : timeA) -
            (isNaN(timeB) ? Infinity : timeB)
          );
        };

        const calendarCells = (() => {
          const year = calendarCursor.getFullYear();
          const month = calendarCursor.getMonth();
          const first = new Date(year, month, 1);
          const gridStart = new Date(year, month, 1 - first.getDay());
          return Array.from({ length: 42 }, (_, index) => {
            const date = new Date(
              gridStart.getFullYear(),
              gridStart.getMonth(),
              gridStart.getDate() + index,
            );
            const key = formatLocalDateKey(date);
            return {

              key,
              inMonth: date.getMonth() === month,
              holidayName: getJapaneseHolidayName(date),
              items: todos.filter((todo) => todoOccursOnDate(todo, key)),
            };
          });
        })();

        const selectedCalendarItems = todos
          .filter((todo) => todoOccursOnDate(todo, selectedDateKey))
          .sort(sortFunction);

        const moveCalendarMonth = (offset) => {
          setCalendarCursor(
            new Date(
              calendarCursor.getFullYear(),
              calendarCursor.getMonth() + offset,

          setSelectedDateKey(formatLocalDateKey(now));
        };

        const getAlertBadge = (dueDate) => {
          if (!dueDate) return null;
          const due = new Date(dueDate);
          if (isNaN(due.getTime())) return null;
          const diffHours = (due - currentTime) / (1000 * 60 * 60);

          if (diffHours < 0)
            return {
              label: "⚠️ 期限切れ！",
              classes:
                "bg-red-600 text-white border-red-700 font-black animate-pulse shadow-lg",
            };
          if (diffHours <= 3)
            return {
              label: "🔥 あと3時間以内！",
              classes:
                "bg-red-500 text-white border-red-600 animate-pulse shadow-md",
            };
          if (diffHours <= 48)
            return {
              label: "🚨 あと2日以内",
              classes: "bg-orange-500 text-white border-orange-600 shadow-sm",
            };
          if (diffHours <= 168)
            return {
              label: "🔔 あと1週間以内",
              classes:
                "bg-orange-100 text-orange-800 border-orange-300 font-bold",
            };
          return null;
        };

        const TodoItem = ({ todo }) => {
          const dueObj = new Date(todo.dueDate);
          const isValidDate = !isNaN(dueObj.getTime());

          const isCompleted = todo.status === "完了";
          const isChecked = todo.status === "チェック済";
          const isCrossedOut = isCompleted || isChecked;

          const isExpired =
            !isCrossedOut &&
            todo.dueDate &&
            isValidDate &&
            dueObj < currentTime;
          const alertBadge =
            !isCrossedOut && isValidDate ? getAlertBadge(todo.dueDate) : null;

          let borderColorClass = "border-gray-100";
          let iconColorClass = "text-gray-400";
          let bgClass = "bg-white";
          let titleColorClass = "text-slate-700";

          if (isCompleted) {
            bgClass = "bg-white";
            titleColorClass = "line-through text-slate-800 font-bold";
            borderColorClass =
              "border-2 border-slate-300";
            iconColorClass = "text-slate-600";
          } else if (isChecked) {
            bgClass = "bg-white";
            titleColorClass = "line-through text-slate-800 font-bold";
            borderColorClass =
              "border-l-4 border-l-slate-400 border-y-slate-300 border-r-slate-300";
            iconColorClass = "text-slate-600";
          } else if (isExpired) {
            bgClass = "bg-red-50";
            borderColorClass =
              "border-2 border-red-500 shadow-md animate-bounce-pulse";
            iconColorClass = "text-red-600";
            titleColorClass = "text-red-800 font-black";
          } else {
            if (todo.color === "green") {
              borderColorClass =
                "border-l-4 border-l-green-400 border-y-gray-100 border-r-gray-100";
              iconColorClass = "text-green-500";
            } else if (todo.color === "yellow") {
              borderColorClass =
                "border-l-4 border-l-yellow-400 border-y-gray-100 border-r-gray-100";
              iconColorClass = "text-yellow-500";
            } else if (todo.color === "purple") {
              borderColorClass =
                "border-l-4 border-l-purple-400 border-y-gray-100 border-r-gray-100";
              iconColorClass = "text-purple-500";
            } else if (todo.color === "orange") {
              borderColorClass =
                "border-l-4 border-l-[#f28b82] border-y-gray-100 border-r-gray-100";
              iconColorClass = "text-[#f28b82]";
            } else {
              borderColorClass =
                "border-l-4 border-l-blue-400 border-y-gray-100 border-r-gray-100";
              iconColorClass = "text-blue-500";
            }
          }

          const priorityColors = {
            高: "bg-red-50 text-red-600 border-red-200",
            中: "bg-yellow-50 text-yellow-600 border-yellow-200",
            低: "bg-blue-50 text-blue-600 border-blue-200",
          };

          const isMemo = todo.type === "memo";

          return (
            <div
              className={`p-4 mb-4 rounded-2xl shadow-sm transition-all duration-300 ${bgClass} ${borderColorClass}`}
            >
              {alertBadge && (
                <div className="mb-3">
                  <span
                    className={`text-xs px-3 py-1.5 rounded-lg border inline-block ${alertBadge.classes}`}
                  >
                    {alertBadge.label}

              )}

              <div className="flex items-start justify-between gap-3">

                        >
                          <i className="fa-solid fa-chevron-right"></i>
                        </button>
                      </div>
                      <button
                        type="button"
                        onClick={goCalendarToday}
                        className="mt-3 w-full py-2 rounded-xl bg-white border-2 border-slate-300 text-xs font-black text-slate-800"
                      >
                        今日へ戻る
                      </button>
                      <div className="mt-2 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[9px] font-black">
                        <span className="text-red-700">● 日曜・祝日</span>
                        <span className="text-blue-700">● 土曜</span>
                        <span className="text-slate-700">● TODO・メモがある日のみ表示</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-7 border-b-2 border-slate-300 bg-white">
                      {["日", "月", "火", "水", "木", "金", "土"].map((weekday, index) => (
                        <div
                          key={weekday}
                          className={`py-2.5 text-center text-[11px] font-black border-r border-slate-300 last:border-r-0 ${index === 0 ? "text-red-700 bg-red-50" : index === 6 ? "text-blue-700 bg-blue-50" : "text-slate-800"}`}
                        >
                          {weekday}
                        </div>
                      ))}
                    </div>

                    <div className="grid grid-cols-7 border-l border-t border-slate-300 bg-white">
                      {calendarCells.map((cell) => {
                        const isSelected = cell.key === selectedDateKey;
                        const isToday = cell.key === formatLocalDateKey(new Date());
                        const weekday = cell.date.getDay();
                        const isHoliday = Boolean(cell.holidayName);
                        const displayItems = cell.inMonth ? cell.items : [];
                        const activeCount = displayItems.filter((item) => item.status !== "完了").length;
                        const dayTone = isHoliday || weekday === 0
                          ? "text-red-700"
                          : weekday === 6
                            ? "text-blue-700"
                            : "text-slate-900";
                        const cellBackground = !cell.inMonth
                          ? "bg-slate-50"
                          : isHoliday
                            ? "bg-red-50"
                            : weekday === 0
                              ? "bg-rose-50"
                              : weekday === 6
                                ? "bg-blue-50"
                                : "bg-white";
                        return (
                          <div
                            key={cell.key}
                            role="button"
                            tabIndex={0}
                            onClick={() => setSelectedDateKey(cell.key)}
                            onKeyDown={(event) => {
                              if (event.key === "Enter" || event.key === " ") {
                                event.preventDefault();
                                setSelectedDateKey(cell.key);
                              }
                            }}
                            className={`min-h-[96px] p-1.5 text-left relative border-r border-b border-slate-300 cursor-pointer ${cellBackground} ${isSelected ? "ring-[3px] ring-inset ring-emerald-600 z-10" : ""}`}
                          >
                            <div className="flex items-start justify-between gap-1">
                              <span
                                className={`inline-flex w-7 h-7 flex-shrink-0 items-center justify-center rounded-full text-[12px] font-black ${!cell.inMonth ? "text-slate-400" : isToday ? "bg-slate-900 text-white" : dayTone}`}
                              >
                                {cell.date.getDate()}
                              </span>
                              {displayItems.length > 0 && (
                                <span className={`rounded-full px-1.5 py-0.5 text-[8px] font-black border ${activeCount > 0 ? "bg-emerald-100 text-emerald-900 border-emerald-400" : "bg-slate-100 text-slate-800 border-slate-400"}`}>
                                  {displayItems.length}件
                                </span>
                              )}
                            </div>
                            {cell.inMonth && cell.holidayName && (
                              <div
                                className="mt-0.5 truncate text-[8px] leading-tight font-black text-red-700"
                                title={cell.holidayName}
                              >
                                {cell.holidayName}
                              </div>
                            )}
                            {displayItems.length > 0 && (
                              <div className="mt-1 space-y-1">
                                {displayItems.slice(0, 2).map((item) => (
                                  <button
                                    key={item.id}
                                    type="button"
                                    onClick={(event) => {
                                      event.stopPropagation();
                                      setSelectedDateKey(cell.key);
                                      startEdit(item, "calendar", cell.key);
                                    }}
                                    title={`${item.title}（タップで修正）`}
                                    className={`block w-full text-left truncate rounded-md border px-1 py-1 text-[8px] font-black ${item.status === "完了" ? "bg-slate-100 text-slate-800 border-slate-400 line-through" : item.type === "memo" ? "bg-orange-100 text-orange-900 border-orange-400" : "bg-emerald-100 text-emerald-950 border-emerald-400"}`}
                                  >
                                    {item.status === "完了" ? "✓" : item.type === "memo" ? "📝" : "●"} {item.title}
                                  </button>
                                ))}
                                {displayItems.length > 2 && (
                                  <div className="text-[9px] font-black text-slate-700 pl-1">
                                    ＋{displayItems.length - 2}件
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-white border-2 border-slate-300 rounded-2xl p-4 mb-4 shadow-sm">
                    <div className="flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <p className="text-[10px] font-black text-slate-600">選択した日</p>
                        <h3 className="text-lg font-black text-slate-950">{dateKeyToLabel(selectedDateKey)}</h3>
                        {getJapaneseHolidayName(new Date(`${selectedDateKey}T00:00:00`)) && (
                          <p className="mt-0.5 text-xs font-black text-red-700">
                            祝日：{getJapaneseHolidayName(new Date(`${selectedDateKey}T00:00:00`))}
                          </p>
                        )}
                        <p className="mt-1 text-[10px] font-bold text-slate-600">
                          {selectedCalendarItems.length > 0
                            ? `${selectedCalendarItems.length}件あります。修正・削除もここからできます。`
                            : "この日に予定はありません。"}
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={() => addFromCalendar(selectedDateKey)}
                        className="flex-shrink-0 px-4 py-3 rounded-xl bg-slate-900 text-white text-xs font-black shadow-md active:scale-95"
                      >
                        <i className="fa-solid fa-plus mr-1"></i>追加
                      </button>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {selectedCalendarItems.length > 0 ? (
                      selectedCalendarItems.map((todo) => (
                        <CalendarDayItem key={todo.id} todo={todo} />
                      ))
                    ) : (
                      <button
                        type="button"
                        onClick={() => addFromCalendar(selectedDateKey)}
                        className="w-full text-center py-10 text-slate-700 font-black bg-white rounded-[2rem] border-2 border-dashed border-slate-400 shadow-sm active:scale-[0.99]"
                      >
                        <i className="fa-solid fa-plus-circle text-2xl mb-2 block text-slate-700"></i>
                        この日のTODO・メモを追加
                      </button>
                    )}
                  </div>
                </div>
              )}

              {currentView === "memo" && (
                <div className="animate-in fade-in slide-in-from-right-8">
                  <h2 className="text-lg font-black text-slate-700 mb-4 ml-2 flex items-center gap-2">
                    <i className="fa-solid fa-note-sticky text-orange-400"></i>{" "}
                    記憶・メモ
                  </h2>
                  <div className="space-y-2">
                    {activeMemos.length > 0 ? (
                      activeMemos
                        .sort(sortFunction)
                        .map((todo) => <TodoItem key={todo.id} todo={todo} />)
                    ) : (
                      <div className="text-center py-24 text-gray-400 font-bold bg-white rounded-[2.5rem] border-2 border-gray-100 shadow-sm">
                        記憶しているメモはありません 📝
                      </div>
                    )}
                  </div>
                </div>
              )}

              {currentView === "history" && (
                <div className="animate-in fade-in slide-in-from-right-8">
                  <h2 className="text-lg font-black text-slate-800 mb-4 ml-2 flex items-center gap-2">
                    <i className="fa-solid fa-box-archive text-slate-600"></i>{" "}
                    完了した履歴
                  </h2>
                  <div className="space-y-2">
                    {completedTodos.length > 0 ? (
                      completedTodos.map((todo) => (
                        <TodoItem key={todo.id} todo={todo} />
                      ))
                    ) : (
                      <div className="text-center py-24 text-gray-400 font-bold bg-white rounded-[2.5rem] border-2 border-gray-100 shadow-sm">
                        まだ完了した履歴はありません
                      </div>
                    )}
                  </div>
                </div>
              )}

              {}
              {currentView === "settings" && (
                <div className="animate-in fade-in">
                  <button
                    onClick={() => setCurrentView("list")}
                    className="mb-8 text-slate-600 font-black bg-white px-5 py-2.5 rounded-full shadow-sm border-2 border-gray-200 active:scale-90 transition-all"
                  >
                    <i className="fa-solid fa-arrow-left"></i> 戻る
                  </button>
                  <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border-2 border-gray-100 text-center">
                    <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6">
                      <i className="fa-solid fa-gear text-2xl text-gray-400"></i>
                    </div>
                    <h2 className="text-xl font-black mb-8">システム設定</h2>
                    <div className="space-y-6 text-left">
                      <div>
                        <label className="text-[10px] font-black text-gray-500 mb-2 block uppercase tracking-widest ml-1">
                          GAS Web App URL
                        </label>
                        <input
                          type="text"
                          value={gasUrl}
                          onChange={(e) => setGasUrl(e.target.value)}
                          placeholder="https://script.google.com/..."
                          className="w-full px-5 py-4 bg-white border-2 border-gray-400 rounded-2xl focus:border-gray-700 focus:outline-none font-bold text-gray-900 transition-all"
                        />
                      </div>
                      <button
                        onClick={() => saveGasUrl(gasUrl)}
                        className="w-full py-4.5 bg-[#98C4A6] text-white font-black rounded-2xl shadow-xl shadow-[#98C4A6]/20 transition-all active:scale-95"
                      >
                        設定を保存
                      </button>

                      <div className="mt-8 pt-6 border-t-2 border-gray-100">
                        <h3 className="text-sm font-black text-slate-700 mb-2 flex items-center gap-2">
                          <i className="fa-solid fa-life-ring text-blue-500"></i>{" "}
                          万が一のデータ復元（レスキュー）
                        </h3>
                        <p className="text-[10px] text-gray-500 mb-4 leading-relaxed font-bold">
                          クラウド上のデータがおかしい場合、現在この画面に表示されているデータでクラウド側を強制上書きして修正します。
                        </p>
                        <button
                          type="button"
                          onClick={async () => {
                            if (
                              window.confirm(
                                "現在の端末のデータでクラウド（スプレッドシート）を上書き復旧します。よろしいですか？",
                              )
                            ) {
                              await exportToSpreadsheet(todos);
                              alert("強制上書きが完了しました。");
                            }
                          }}
                          className="flex items-center justify-center w-full py-4 bg-white border-2 border-blue-400 text-blue-500 font-black rounded-2xl hover:bg-blue-50 transition-all active:scale-95 shadow-sm"
                        >
                          <i className="fa-solid fa-cloud-arrow-up mr-2 text-lg"></i>{" "}
                          端末のデータでクラウドを復旧
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <div className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-100 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)] z-50">
                <div className="max-w-md mx-auto flex justify-around items-center p-2">
                  <button
                    onClick={() => {
                      resetForm();
                      setFormReturnView("list");
                      setFormReturnDateKey("");
                      setCurrentView("input");
                    }}
                    className={`flex flex-col items-center gap-1 p-2 w-14 sm:w-16 transition-colors ${currentView === "input" ? "text-slate-800" : "text-gray-400 hover:text-gray-600"}`}
                  >
                    <i className="fa-solid fa-plus text-xl"></i>
                    <span className="text-[10px] font-bold">追加</span>
                  </button>
                  <button
                    onClick={() => {
                      resetForm();
                      setCurrentView("list");
                    }}
                    className={`relative flex flex-col items-center gap-1 p-2 w-14 sm:w-16 transition-colors ${currentView === "list" || currentView === "edit" ? "text-[#98C4A6]" : "text-gray-400 hover:text-gray-600"}`}
                  >
                    {expiredTodos.length > 0 && (
                      <span className="absolute top-1 right-2 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                    )}
                    <i className="fa-solid fa-bolt text-xl"></i>
                    <span className="text-[10px] font-bold">TODO</span>
                  </button>
                  <button
                    onClick={() => {
                      resetForm();
                      setCurrentView("calendar");
                    }}
                    className={`flex flex-col items-center gap-1 p-2 w-14 sm:w-16 transition-colors ${currentView === "calendar" ? "text-emerald-600" : "text-gray-400 hover:text-gray-600"}`}
                  >
                    <i className="fa-solid fa-calendar-days text-xl"></i>
                    <span className="text-[10px] font-bold">カレンダー</span>
                  </button>
                  <button
                    onClick={() => {
                      resetForm();
                      setCurrentView("memo");
                    }}
                    className={`flex flex-col items-center gap-1 p-2 w-14 sm:w-16 transition-colors ${currentView === "memo" ? "text-orange-400" : "text-gray-400 hover:text-gray-600"}`}
                  >
                    <i className="fa-solid fa-note-sticky text-xl"></i>
                    <span className="text-[10px] font-bold">メモ</span>
                  </button>
                  <button
                    onClick={() => {
                      resetForm();
                      setCurrentView("history");
                    }}
                    className={`flex flex-col items-center gap-1 p-2 w-14 sm:w-16 transition-colors ${currentView === "history" ? "text-slate-800" : "text-gray-400 hover:text-gray-600"}`}
                  >
                    <i className="fa-solid fa-box-archive text-xl"></i>
                    <span className="text-[10px] font-bold">履歴</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(
        <AppErrorBoundary>
          <App />
        </AppErrorBoundary>,
      );
      window.__todoAppMounted = true;
    </script>
  </body>
</html>
