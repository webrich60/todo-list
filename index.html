<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TODO管理 v2.7.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#142f48;font:16px system-ui}main{max-width:850px;margin:auto;padding:12px}header img{display:block;width:100%;max-height:220px;object-fit:contain;background:#195a99;border-radius:12px}small{font-size:13px}section{background:white;border:2px solid #8299ad;border-radius:12px;padding:14px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}button,input,select,textarea{font:inherit;padding:10px;border:1.5px solid #496780;border-radius:7px;max-width:100%}button{background:#174c81;color:white;cursor:pointer}button:disabled{opacity:.5}input:not([type=checkbox]),textarea,select{width:100%;background:white;color:#142f48}input[type=checkbox]{width:23px;height:23px;vertical-align:middle}label{display:block;margin:8px 0}nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav button{flex:1}article{border:2px solid #8299ad;border-radius:8px;padding:12px;margin:8px 0;overflow-wrap:anywhere}article.yellow{border:3px solid #c49b00;background:#fffce6}article.orange{border:3px solid #d76a00;background:#fff3e3}article.red{border:3px solid #ba2334;background:#fff0f0}.done{text-decoration:line-through;color:#546576}.row span{flex:1;min-width:100px}#status{white-space:pre-wrap;font-weight:bold}#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}#calendar button{padding:5px 0;min-height:46px;background:#f4f8fc;color:#123b61}#calendar button.mark{background:#174c81;color:white}#calendar button.chosen{outline:3px solid #d76a00}#calendar span{text-align:center} [hidden]{display:none!important}.danger{background:#9b2735} @media(max-width:460px){main{padding:8px}section{padding:10px}header img{max-height:140px}}
</style></head><body><main><header><img src="todo-header.webp" alt="TODOリスト"><small>v2.7.1 再構築版</small></header><section><details id="settings"><summary>同期・通知設定</summary><label>GAS ウェブアプリURL<input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label><button id="connect">接続・同期</button> <button id="checkPush">通知設定確認</button><p>通知は既存GASの設定・登録端末を使用します。新規端末登録は旧画面で行ってください。</p></details><p id="status" role="status">GAS接続を設定してください。</p><button id="refresh">最新データを取得</button></section><nav><button data-tab="todos">TODO・メモ</button><button data-tab="cal">カレンダー</button><button data-tab="shop">買い物</button></nav><div id="todos"><section><h2>TODO・メモ登録</h2><form id="todoform"><label>タイトル<input id="title" required maxlength="200"></label><label>種別<select id="type"><option value="todo">TODO</option><option value="memo">メモ</option></select></label><label>詳細<textarea id="desc"></textarea></label><label>カテゴリ<input id="category" list="cats" value="未分類"><datalist id="cats"></datalist></label><label>優先度<select id="priority"><option>中</option><option>高</option><option>低</option></select></label><label>期限<input id="due" type="datetime-local"></label><label>終了日時<input id="end" type="datetime-local"></label><label><input type="checkbox" id="mail" checked> メール通知</label><label><input type="checkbox" id="push" checked> スマホ通知</label><button id="saveTodo">保存</button> <button type="button" id="cancelEdit">入力取消</button></form></section><section><h2>登録済みTODO</h2><label>表示<select id="filter"><option value="all">すべて</option><option value="open">未完了</option><option value="done">完了</option></select></label><div id="tasks"></div></section></div><div id="cal" hidden><section><div class="row"><button id="prev">前月</button><h2 id="month"></h2><button id="next">翌月</button></div><div id="calendar"></div><h2 id="daytitle"></h2><div id="daytasks"></div></section></div><div id="shop" hidden><section><h2>買い物リスト</h2><form id="shopform" class="row"><input id="product" required maxlength="200" placeholder="買いたいもの"><button>追加</button></form><p id="count"></p><div id="shopping"></div></section></div></main><script>
'use strict';const $=id=>document.getElementById(id);let tasks=[],shopping=[],categories=[],editing=null,busy=false,ready=false,shopReady=false,month=new Date(),selected='',url='';try{url=localStorage.getItem('todo271_gas_url')||''}catch{}$('url').value=url;$('settings').open=!url;const status=s=>$('status').textContent=s;const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const dateKey=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);function key(s){let m=String(s||'').match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''}function days(s){let k=key(s);return k?(Date.parse(k)-Date.parse(dateKey(new Date())))/86400000:Infinity}function done(t){return t.status==='完了'}function node(tag,txt,cls){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function btn(txt,fn,cls){let b=node('button',txt,cls);b.type='button';b.onclick=fn;b.disabled=busy;return b}function jsonp(action=''){return new Promise((resolve,reject)=>{const cb='todo271_'+id().replace(/[^a-zA-Z0-9]/g,'');let s=document.createElement('script'),timer;const clean=()=>{clearTimeout(timer);s.remove();delete window[cb]};window[cb]=v=>{clean();v&&v.ok===false?reject(Error(v.error||'GASエラー')):resolve(v)};s.onerror=()=>{clean();reject(Error('GAS接続失敗'))};timer=setTimeout(()=>{clean();reject(Error('GAS応答タイムアウト'))},18000);const u=new URL(url);u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());if(action)u.searchParams.set('action',action);s.src=u.href;document.head.append(s)})}async function post(data){await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(data),redirect:'follow'});}async function load(){let a=await jsonp();if(!Array.isArray(a))throw Error('TODOデータ形式が不正です');tasks=a;ready=true;try{let c=await jsonp('categories');if(Array.isArray(c))categories=c}catch{}try{let b=await jsonp('shopping');if(!b||!Array.isArray(b.items))throw Error();shopping=b.items;shopReady=true;status('同期完了：TODO '+tasks.length+'件／買い物 '+shopping.length+'件')}catch{shopReady=false;status('TODO同期完了。買い物GASが未接続です。')}render()}async function run(fn){if(busy)return;busy=true;render();try{await fn()}catch(e){status('エラー：'+e.message+'。保存状態を確認するため再同期してください。')}finally{busy=false;render()}}async function verify(test,action){for(let i=0;i<4;i++){if(i)await new Promise(r=>setTimeout(r,800*i));let a=await jsonp(action);if(test(a))return a}throw Error('保存の確認ができませんでした')}
function renderTasks(el,arr){el.replaceChildren();if(!arr.length)el.append(node('p','登録なし'));for(const t of arr){let d=days(t.dueDate),a=node('article',undefined,done(t)?'':d<=0?'red':d===1?'orange':d===2?'yellow':'');a.append(node('strong',t.title,done(t)?'done':''),node('p',[t.category,t.priority,t.dueDate||'期限なし',done(t)?'完了':d===2?'2日前':d===1?'明日まで':d===0?'今日まで':d<0?'期限超過':''].filter(Boolean).join(' ／ ')));if(t.description)a.append(node('p',t.description));let r=node('div',undefined,'row');r.append(btn(done(t)?'未完了に戻す':'完了',()=>run(async()=>{let n={...t,status:done(t)?'未完了':'完了',completedAt:done(t)?'':new Date().toISOString(),updatedAt:new Date().toISOString()};await post([n]);tasks=await verify(a=>Array.isArray(a)&&a.some(x=>String(x.id)===String(n.id)&&x.status===n.status));status('保存完了')})),btn('編集',()=>edit(t)),btn('削除',()=>{if(confirm('削除しますか？'))run(async()=>{await post({action:'deleteTodo',id:t.id});tasks=await verify(a=>Array.isArray(a)&&!a.some(x=>String(x.id)===String(t.id)));status('削除完了')})},'danger'));a.append(r);el.append(a)}}
function render(){let f=$('filter').value;renderTasks($('tasks'),tasks.filter(t=>f==='all'||(f==='done'?done(t):!done(t))).sort((a,b)=>(done(a)-done(b))||String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))));$('cats').replaceChildren(...categories.map(c=>{let o=node('option');o.value=typeof c==='string'?c:c.name||'';return o}));$('saveTodo').disabled=busy||!ready;$('connect').disabled=busy;$('refresh').disabled=busy;$('shopform').querySelector('button').disabled=busy||!shopReady;let el=$('shopping');el.replaceChildren();for(let t of shopping){let a=node('article'),r=node('div',undefined,'row'),c=node('input');c.type='checkbox';c.checked=t.done;c.disabled=busy||!shopReady;c.setAttribute('aria-label',t.name+'購入済み');c.onchange=()=>changeShop({op:'toggle',id:t.id,done:c.checked});r.append(c,node('span',t.name,t.done?'done':''),btn('削除',()=>{if(confirm('削除しますか？'))changeShop({op:'delete',id:t.id})},'danger'));a.append(r);el.append(a)}$('count').textContent=`未購入 ${shopping.filter(x=>!x.done).length}件 / 全${shopping.length}件`;drawCal()}
function changeShop(p){return run(async()=>{if(!shopReady)throw Error('買い物GAS未接続');await post({action:'shoppingChange',...p});let b=await verify(b=>b&&Array.isArray(b.items)&&(p.op==='delete'?!b.items.some(x=>x.id===p.id):b.items.some(x=>x.id===p.id&&(p.op==='add'?x.name===p.name:x.done===p.done))),'shopping');shopping=b.items;status('買い物リスト同期完了');if(p.op==='add')$('product').value=''})}function tab(v){for(let k of ['todos','cal','shop'])$(k).hidden=k!==v}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function edit(t){editing=t;tab('todos');$('title').value=t.title;$('type').value=t.type;$('desc').value=t.description||'';$('category').value=t.category||'未分類';$('priority').value=t.priority||'中';for(let [a,b] of [['due','dueDate'],['end','endDate']]){$(a).value=String(t[b]||'').replace(/\//g,'-').replace(' ','T').slice(0,16)}$('mail').checked=t.mailNotify!==false;$('push').checked=t.pushNotify!==false;$('title').focus()}function reset(){editing=null;$('todoform').reset()}$('cancelEdit').onclick=reset;$('todoform').onsubmit=e=>{e.preventDefault();run(async()=>{if(!ready)throw Error('未接続');let t={...(editing||{}),id:editing?.id||Date.now()*1000+Math.floor(Math.random()*1000),title:$('title').value.trim(),type:$('type').value,description:$('desc').value,category:$('category').value,priority:$('priority').value,dueDate:$('due').value,endDate:$('end').value,mailNotify:$('mail').checked,pushNotify:$('push').checked,status:editing?.status||'未完了',updatedAt:new Date().toISOString()};if(!t.title)throw Error('タイトルを入力してください');await post([t]);tasks=await verify(a=>Array.isArray(a)&&a.some(x=>String(x.id)===String(t.id)&&x.title===t.title&&x.description===t.description));reset();status('TODO保存完了')})};$('shopform').onsubmit=e=>{e.preventDefault();let name=$('product').value.trim();if(name)changeShop({op:'add',id:id(),name})};$('filter').onchange=render;
function drawCal(){let y=month.getFullYear(),m=month.getMonth(),c=$('calendar');$('month').textContent=`${y}年 ${m+1}月`;c.replaceChildren(...['日','月','火','水','木','金','土'].map(x=>node('span',x)));for(let i=0;i<new Date(y,m,1).getDay();i++)c.append(node('span'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=tasks.filter(t=>key(t.dueDate)===k).length,b=btn(d+(n?' •'+n:''),()=>{selected=k;drawCal()},(n?'mark ':'')+(selected===k?'chosen':''));c.append(b)}$('daytitle').textContent=selected||'日付を選択';renderTasks($('daytasks'),tasks.filter(t=>selected&&key(t.dueDate)===selected))}$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);drawCal()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);drawCal()};$('connect').onclick=()=>run(async()=>{let u=new URL($('url').value.trim());if(u.origin!=='https://script.google.com'||!/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname))throw Error('GASの /exec URLを入力してください');url=u.href;ready=shopReady=false;tasks=[];shopping=[];localStorage.setItem('todo271_gas_url',url);await load()});$('refresh').onclick=()=>run(load);$('checkPush').onclick=()=>run(async()=>{let v=await jsonp('notificationStatus');status('スマホ通知設定：'+(v.configured?'設定済み':'未設定')+'／登録端末 '+(v.deviceCount??'不明')+'台'+(v.reason?'／'+v.reason:''))});render();if(url)run(load);
</script></body></html>
