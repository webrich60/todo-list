</style></head><body><main><header><img src="todo-header.webp" alt="TODOリスト"><div class="toolbar"><small>v2.7.4</small><button id="refresh" type="button" class="tool" aria-label="最新データを取得">↻ <span>更新</span></button><button data-tab="preferences" type="button" class="tool" aria-label="設定ページ">⚙ 設定</button></div><p id="status" role="status" aria-live="polite">GAS接続を設定してください。</p></header><nav aria-label="メインメニュー"><button data-tab="todos">TODO・メモ</button><button data-tab="cal">カレンダー</button><button data-tab="shop">買い物</button></nav><div id="preferences" hidden><section><h2>⚙ 同期・通知設定</h2><label>GAS ウェブアプリURL<input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label><div class="row"><button id="connect">接続・同期</button><button id="checkPush">通知設定確認</button></div><p>通知は既存GASの設定・登録端末を使用します。新規端末登録は旧画面で行ってください。</p><button data-tab="todos" type="button">← TODOへ戻る</button></section></div><div id="todos"><section><h2>TODO・メモ登録</h2><form id="todoform"><label>タイトル<input id="title" required maxlength="200"></label><label>種別<select id="type"><option value="todo">TODO</option><option value="memo">メモ</option></select></label><label>詳細<textarea id="desc"></textarea></label><label for="category">カテゴリー</label><div class="category-tools"><select id="category" aria-label="カテゴリー"></select><button id="showAddCategory" type="button" aria-expanded="false" aria-controls="categoryAdd">＋追加</button></div><div id="categoryAdd" class="category-add" hidden><label for="newCategory">新しいカテゴリー名</label><div class="row"><input id="newCategory" maxlength="60" placeholder="例：猫の病院"><button id="saveCategory" type="button">登録</button></div><p>登録したカテゴリーはスプレッドシートに保存します。</p><button id="cancelCategory" type="button">閉じる</button></div><p id="categoryMessage" role="status" aria-live="polite"></p><label>優先度<select id="priority"><option>中</option><option>高</option><option>低</option></select></label><label>期限<input id="due" type="datetime-local"></label><label>終了日時<input id="end" type="datet 'use strict';const $=id=>document.getElementById(id);let tasks=[],shopping=[],categories=[],editing=null,busy=false,ready=false,shopReady=false,month=new Date(),selected='',url='';try{url=localStorage.getItem('todo271_gas_url')||''}catch{}$('url').value=url;const DEFAULT_CATEGORIES=['未分類','仕事','プライベート','家族','お出かけ','旅行','観光','遊び','外食','病院','ペット・動物病院','買い物','趣味','その他'];function catName(c){return String(typeof c==='string'?c:(c?.category||c?.name||c?.value||'')).trim()}function mergeCats(...lists){return [...new Set(lists.flat().map(catName).filter(Boolean))]}function allCats(){return mergeCats(DEFAULT_CATEGORIES,categories,tasks.map(t=>t.category),editing?[editing.category]:[])}function renderCats(){let select=$('category'),current=select.value||'未分類',names=allCats();select.replaceChildren(...names.map(c=>{let o=node('option',c);o.value=c;return o}));select.value=names.includes(current)?current:'未分類';$('saveCategory').disabled=busy||!ready;}let noticeTimer;function notify(message,kind='info'){clearTimeout(noticeTimer);let n=$('notice');n.dataset.kind=kind;$('noticeIcon').textContent=({success:'✓',error:'⚠',warning:'!',info:'ℹ',pending:'↻'})[kind]||'ℹ';$('noticeText').textContent=message;n.hidden=false;if(kind!=='pending')noticeTimer=setTimeout(()=>{n.hidden=true},kind==='error'||kind==='warning'?8500:kind==='info'?3000:4500)}$('noticeClose').onclick=()=>{clearTimeout(noticeTimer);$('notice').hidden=true};function status(s,kind='info'){$('status').textContent=s;notify(s,kind)}const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const dateKey=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);function key(s){let m=String(s||'').match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''}function days(s){let k=key(s);return k?(Date.parse(k)-Date.parse(dateKey(new Date())))/86400000:Infinity}function dateTimeValue(v){let m=String(v||'').trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2}))?/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')+'T'+(m[4]||'0').padStart(2,'0')+':'+(m[5]||'00'):String(v||'').trim()}function sameTask(x,t){return String(x.id)===String(t.id)&&['title','description','category','type','priority','status','mailNotify','pushNotify'].every(k=>x[k]===t[k])&&['dueDate','endDate'].every(k=>dateTimeValue(x[k])===dateTimeValue(t[k]))}function done(t){return t.status==='完了'}function node(tag,txt,cls){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function btn(txt,fn,cls){let b=node('button',txt,cls);b.type='button';b.onclick=fn;b.disabled=busy;return b}function jsonp(action=''){return new Promise((resolve,reject)=>{const cb='todo271_'+id().replace(/[^a-zA-Z0-9]/g,'');let s=document.createElement('script'),timer;const clean=()=>{clearTimeout(timer);s.remove();delete window[cb]};window[cb]=v=>{clean();v&&v.ok===false?reject(Error(v.error||'GASエラー')):resolve(v)};s.onerror=()=>{clean();reject(Error('GAS接続失敗'))};timer=setTimeout(()=>{clean();reject(Error('GAS応答タイムアウト'))},18000);const u=new URL(url);u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());if(action)u.searchParams.set('action',action);s.src=u.href;document.head.append(s)})}async function post(data){await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(data),redirect:'follow'});}async function load(){if(!url)throw Error('設定画面でGASのURLを登録してください');let a=await jsonp();if(!Array.isArray(a))throw Error('TODOデータ形式が不正です');tasks=a;ready=true;let warnings=[];try{let c=await jsonp('categories');if(!Array.isArray(c))throw Error();categories=mergeCats(c)}catch{warnings.push('カテゴリーの同期に失敗')}try{let b=await jsonp('shopping');if(!b||!Array.isArray(b.items))throw Error();shopping=b.items;shopReady=true}catch{shopReady=false;warnings.push('買い物の同期に失敗')}status('TODO '+tasks.length+'件を同期しました'+(shopReady?'／買い物 '+shopping.length+'件':'')+(warnings.length?'。'+warnings.join('／'):'。'),warnings.length?'warning':'success');render()}async function run(fn,pending='処理中です…'){if(busy){notify('処理中です。完了までお待ちください。','pending');return}busy=true;notify(pending,'pending');render();try{await fn()}catch(e){status('エラー：'+e.message+'。保存状態を確認するため再同期してください。','error')}finally{busy=false;render()}}async function verify(test,action){for(let i=0;i<4;i++){if(i)await new Promise(r=>setTimeout(r,800*i));let a=await jsonp(action);if(test(a))return a}throw Error('保存の確認ができませんでした')}
function renderTasks(el,arr){el.replaceChildren();if(!arr.length)el.append(node('p','登録なし'));for(const t of arr){let d=days(t.dueDate),a=node('article',undefined,done(t)?'':d<=0?'red':d===1?'orange':d===2?'yellow':'');a.append(node('strong',t.title,done(t)?'done':''),categoryChip(t.category),node('p',[t.priority,t.dueDate||'期限なし',done(t)?'完了':d===2?'2日前':d===1?'明日まで':d===0?'今日まで':d<0?'期限超過':''].filter(Boolean).join(' ／ ')));if(t.description)a.append(node('p',t.description));let r=node('div',undefined,'row');r.append(btn(done(t)?'未完了に戻す':'完了',()=>run(async()=>{let n={...t,status:done(t)?'未完了':'完了',completedAt:done(t)?'':new Date().toISOString(),updatedAt:new Date().toISOString()};await post([n]);tasks=await verify(a=>Array.isArray(a)&&a.some(x=>String(x.id)===String(n.id)&&x.status===n.status));status(done(n)?'TODOを完了にしました。':'TODOを未完了に戻しました。','success')},'変更を保存しています…')),btn('編集',()=>{edit(t);notify('編集画面を開きました。')}),btn('削除',()=>{if(confirm('削除しますか？'))run(async()=>{await post({action:'deleteTodo',id:t.id});tasks=await verify(a=>Array.isArray(a)&&!a.some(x=>String(x.id)===String(t.id)));status('TODOを削除しました。','success')},'削除しています…');else notify('削除を取り消しました。')},'danger'));a.append(r);el.append(a)}}
function render(){let f=$('filter').value;renderTasks($('tasks'),tasks.filter(t=>f==='all'||(f==='done'?done(t):!done(t))).sort((a,b)=>(done(a)-done(b))||String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))));renderCats();$('saveTodo').disabled=busy||!ready;$('connect').disabled=busy;$('refresh').disabled=busy;$('checkPush').disabled=busy;$('shopform').querySelector('button').disabled=busy||!shopReady;let el=$('shopping');el.replaceChildren();for(let t of shopping){let a=node('article'),r=node('div',undefined,'row'),c=node('input');c.type='checkbox';c.checked=t.done;c.disabled=busy||!shopReady;c.setAttribute('aria-label',t.name+'購入済み');c.onchange=()=>changeShop({op:'toggle',id:t.id,done:c.checked});r.append(c,node('span',t.name,t.done?'done':''),btn('削除',()=>{if(confirm('削除しますか？'))changeShop({op:'delete',id:t.id});else notify('削除を取り消しました。')},'danger'));a.append(r);el.append(a)}$('count').textContent=`未購入 ${shopping.filter(x=>!x.done).length}件 / 全${shopping.length}件`;drawCal()}
function changeShop(p){return run(async()=>{if(!shopReady)throw Error('買い物GAS未接続');await post({action:'shoppingChange',...p});let b=await verify(b=>b&&Array.isArray(b.items)&&(p.op==='delete'?!b.items.some(x=>x.id===p.id):b.items.some(x=>x.id===p.id&&(p.op==='add'?x.name===p.name:x.done===p.done))),'shopping');shopping=b.items;status(p.op==='add'?'買い物リストに追加しました。':p.op==='delete'?'買い物リストから削除しました。':p.done?'購入済みにしました。':'未購入に戻しました。','success');if(p.op==='add')$('product').value=''},'買い物リストを保存しています…')}function tab(v){for(let k of ['todos','cal','shop','preferences'])$(k).hidden=k!==v;document.querySelectorAll('nav [data-tab],header [data-tab]').forEach(b=>{let active=b.dataset.tab===v;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});if(v==='cal')drawCal();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab(b.dataset.tab);notify(({todos:'TODO・メモ',cal:'カレンダー',shop:'買い物リスト',preferences:'設定'})[b.dataset.tab]+'を開きました。')});function edit(t){editing=t;tab('todos');$('title').value=t.title;$('type').value=t.type;$('desc').value=t.description||'';$('category').value=t.category||'未分類';$('priority').value=t.priority||'中';for(let [a,b] of [['due','dueDate'],['end','endDate']]){$(a).value=String(t[b]||'').replace(/\//g,'-').replace(' ','T').slice(0,16)}$('mail').checked=t.mailNotify!==false;$('push').checked=t.pushNotify!==false;$('title').focus()}function reset(){editing=null;$('todoform').reset();$('category').value='未分類';$('newCategory').value='';$('categoryMessage').textContent='';toggleCategory(false)}$('cancelEdit').onclick=()=>{reset();notify('入力を取り消しました。')};$('todoform').onsubmit=e=>{e.preventDefault();run(async()=>{if(!ready)throw Error('未接続');let t={...(editing||{}),id:editing?.id||Date.now()*1000+Math.floor(Math.random()*1000),title:$('title').value.trim(),type:$('type').value,description:$('desc').value,category:$('category').value,priority:$('priority').value,dueDate:$('due').value,endDate:$('end').value,mailNotify:$('mail').checked,pushNotify:$('push').checked,status:editing?.status||'未完了',updatedAt:new Date().toISOString()};if(!t.title)throw Error('タイトルを入力してください');await post([t]);tasks=await verify(a=>Array.isArray(a)&&a.some(x=>sameTask(x,t)));let wasEditing=!!editing;reset();status(wasEditing?'TODOの変更を保存しました。':'TODOを保存しました。','success')},'TODOを保存しています…')};$('shopform').onsubmit=e=>{e.preventDefault();let name=$('product').value.trim();if(name)changeShop({op:'add',id:id(),name});else notify('商品名を入力してください。','warning')};$('filter').onchange=()=>{render();notify('表示を「'+$('filter').selectedOptions[0].textContent+'」に変更しました。')};document.addEventListener('invalid',e=>{if(e.target.closest('form'))notify(e.target.id==='title'?'タイトルを入力してください。':e.target.id==='product'?'商品名を入力してください。':'入力内容を確認してください。','warning')},true);
function toggleCategory(open){$('categoryAdd').hidden=!open;$('showAddCategory').setAttribute('aria-expanded',String(open));if(open)$('newCategory').focus()}
$('showAddCategory').onclick=()=>{toggleCategory($('categoryAdd').hidden);$('categoryMessage').textContent=ready?'':'追加するには設定画面からGASに接続してください。';notify(!ready?'カテゴリー追加にはGAS接続が必要です。':$('categoryAdd').hidden?'カテゴリー追加欄を閉じました。':'カテゴリー名を入力してください。',ready?'info':'warning');};
$('cancelCategory').onclick=()=>{toggleCategory(false);notify('カテゴリー追加欄を閉じました。')};
$('newCategory').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(!$('saveCategory').disabled)$('saveCategory').click()}};
$('saveCategory').onclick=()=>{let name=$('newCategory').value.trim();if(!name){$('categoryMessage').textContent='カテゴリー名を入力してください。';notify('カテゴリー名を入力してください。','warning');return}if(!ready||busy)return;if(allCats().includes(name)){$('category').value=name;$('categoryMessage').textContent='既存のカテゴリーを選択しました。';toggleCategory(false);notify('既存のカテゴリーを選択しました。');return}run(async()=>{try{let remote=await jsonp('categories');if(!Array.isArray(remote))throw Error('カテゴリー取得形式が不正です');let merged=mergeCats(DEFAULT_CATEGORIES,remote,categories,tasks.map(t=>t.category),[name]);await post({action:'saveCategories',categories:merged});let saved=await verify(a=>Array.isArray(a)&&merged.every(c=>a.map(catName).includes(c)),'categories');categories=mergeCats(saved);renderCats();$('category').value=name;$('newCategory').value='';toggleCategory(false);$('categoryMessage').textContent='「'+name+'」を登録・同期しました。';status('「'+name+'」を登録・同期しました。','success')}catch(e){$('categoryMessage').textContent='カテゴリーの登録を確認できませんでした。再同期してください。';throw e}},'カテゴリーを保存しています…')};

const PALETTE={

function categoryStyle(c){c=String(c||'');if(/猫|犬|ペット|動物病院/.test(c))return PALETTE.pet;if(/病院|通院|診察|医療|歯科|眼科|クリニック|健康/.test(c))return PALETTE.hospital;if(/旅行|宿泊|旅|ホテル/.test(c))return PALETTE.travel;if(/出かけ|外出|観光|遊び|レジャー|散歩|おでかけ/.test(c))return PALETTE.outing;if(/外食|食事|グルメ|ランチ|カフェ/.test(c))return PALETTE.food;if(/買い物|買物|ショッピング/.test(c))return PALETTE.shopping;if(/プライベート|家族|私用/.test(c))return PALETTE.private;if(/仕事|業務/.test(c))return PALETTE.work;return PALETTE.default}
function paint(e,p){e.style.backgroundColor=p.bg;e.style.color=p.fg;return e}
function categoryChip(c){let p=categoryStyle(c),e=paint(node('span',p.icon+' '+(c||'未分類'),'category-chip'),p);return e}
function drawCal(){let y=month.getFullYear(),m=month.getMonth(),c=$('calendar'),today=dateKey(new Date());$('month').textContent=`${y}年 ${m+1}月`;c.replaceChildren(...['日','月','火','水','木','金','土'].map((x,i)=>node('span',x,'weekday w'+i)));for(let i=0;i<new Date(y,m,1).getDay();i++)c.append(node('span',undefined,'blank-day'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=tasks.filter(t=>key(t.dueDate)===k).sort((a,b)=>Number(done(a))-Number(done(b))||String(a.dueDate).localeCompare(String(b.dueDate))),b=btn('',()=>{selected=k;drawCal();notify(k.replace(/-/g,'/')+' の予定 '+items.length+'件を表示しました。')},'cal-day'+(selected===k?' chosen':'')+(today===k?' today':''));b.setAttribute('aria-label',k+' '+items.length+'件 '+items.map(t=>t.title).join('、'));b.setAttribute('aria-pressed',String(selected===k));b.append(node('span',String(d),'day-number'));for(let t of items.slice(0,2)){let p=categoryStyle(t.category),chip=paint(node('span',p.icon+' '+t.title,'event'+(done(t)?' event-done':'')),p);chip.title=(t.category||'未分類')+'：'+t.title;b.append(chip)}if(items.length>2)b.append(node('span','＋'+(items.length-2)+'件','more-events'));c.append(b)}let legend=$('legend');legend.replaceChildren(...Object.values(PALETTE).filter(p=>p!==PALETTE.pet&&p!==PALETTE.work).map(p=>paint(node('span',p.icon+' '+p.label,'legend-chip'),p)));$('daytitle').textContent=selected?selected.replace(/-/g,'/')+' の予定':'日付を選択';renderTasks($('daytasks'),tasks.filter(t=>selected&&key(t.dueDate)===selected))}$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);drawCal();notify($('month').textContent+'を表示しました。')};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);drawCal();notify($('month').textContent+'を表示しました。')};$('connect').onclick=()=>run(async()=>{let u=new URL($('url').value.trim());if(u.origin!=='https://script.google.com'||!/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname))throw Error('GASの /exec URLを入力してください');url=u.href;ready=shopReady=false;tasks=[];shopping=[];categories=[];localStorage.setItem('todo271_gas_url',url);await load()},'GASに接続・同期しています…');$('refresh').onclick=()=>run(load,'最新データを取得しています…');$('checkPush').onclick=()=>run(async()=>{if(!url)throw Error('GASに接続してください');let v=await jsonp('notificationStatus');status('スマホ通知設定：'+(v.configured?'設定済み':'未設定')+'／登録端末 '+(v.deviceCount??'不明')+'台'+(v.reason?'／'+v.reason:''),v.configured&&Number(v.deviceCount)>0?'success':'warning')},'通知設定を確認しています…');selected=dateKey(new Date());tab('todos');render();if(url)run(load,'最新データを取得しています…');
